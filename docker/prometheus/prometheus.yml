global:
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  - job_name: app
    static_configs:
      - targets: ['host.docker.internal:3101']
        labels: { replica: r1 }
      - targets: ['host.docker.internal:3102']
        labels: { replica: r2 }
      - targets: ['host.docker.internal:3103']
        labels: { replica: r3 }
  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']
  - job_name: pgbouncer
    static_configs:
      - targets: ['pgbouncer-exporter:9127']